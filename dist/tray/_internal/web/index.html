<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <!-- スマホ最適化 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>AiroBridge</title>

    <!-- 外部CSS -->
    <link rel="stylesheet" href="style.css">

    <script>
        async function sendText() {
            const text = document.getElementById("textInput").value;

            await fetch("/send-text", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text })
            });

            alert("テキストを送信しました");
        }

        async function receiveText() {
            const res = await fetch("/receive-text");
            const data = await res.json();
            document.getElementById("textInput").value = data.text;
        }

        async function sendFile() {
            const fileInput = document.getElementById("fileInput");
            if (!fileInput.files.length) {
                alert("ファイルを選択してください");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            await fetch("/send-file", {
                method: "POST",
                body: formData
            });

            alert("ファイルを送信しました");
        }

        async function receiveFile() {
            const res = await fetch("/receive-file");
            if (!res.ok) {
                alert("ファイルがありません");
                return;
            }

            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;

            // Content-Disposition の filename を使う
            const disposition = res.headers.get("Content-Disposition");
            let filename = "received_file";

            if (disposition) {
                const match = disposition.match(/filename="(.+?)"/);
                if (match) filename = match[1];
            }

            a.download = filename;
            a.click();
            window.URL.revokeObjectURL(url);
        }
    </script>
</head>

<body>
    <div class="container">

        <!-- ロゴ + タイトル -->
        <h1 class="title">
            <img src="logo.png" alt="logo" class="logo">
            AiroBridge
        </h1>

        <!-- テキスト共有 -->
        <textarea id="textInput" rows="5" placeholder="ここにテキストを入力"></textarea>
        <button onclick="sendText()">テキスト送信</button>
        <button onclick="receiveText()">テキスト受信</button>

        <!-- ファイル共有 -->
        <input type="file" id="fileInput">
        <button onclick="sendFile()">ファイル送信</button>
        <button onclick="receiveFile()">ファイル受信</button>

    </div>
</body>
</html>
