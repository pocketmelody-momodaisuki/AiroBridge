<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <!-- スマホ最適化の最重要設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>AiroBridge</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Meiryo", sans-serif;
            font-size: 16px;
            background: #f7f7f7;
            line-height: 1.5;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 24px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 16px;
            text-align: center;
        }

        input[type="text"],
        textarea {
            width: 100%;
            font-size: 16px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            margin-top: 12px;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            background: #0078ff;
            color: white;
            border: none;
            border-radius: 6px;
            margin-top: 16px;
        }

        /* スマホ専用レイアウト */
        @media (max-width: 600px) {
            body {
                font-size: 18px;
            }

            input[type="text"],
            textarea,
            button {
                font-size: 18px;
                padding: 14px;
            }

            .container {
                padding: 16px;
            }
        }
    </style>

    <script>
        async function sendText() {
            const text = document.getElementById("textInput").value;

            await fetch("/send-text", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text })
            });

            alert("テキストを送信しました");
        }

        async function receiveText() {
            const res = await fetch("/receive-text");
            const data = await res.json();
            document.getElementById("textInput").value = data.text;
        }

        async function sendFile() {
            const fileInput = document.getElementById("fileInput");
            if (!fileInput.files.length) {
                alert("ファイルを選択してください");
                return;
            }

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            await fetch("/send-file", {
                method: "POST",
                body: formData
            });

            alert("ファイルを送信しました");
        }

        async function receiveFile() {
            const res = await fetch("/receive-file");
            if (!res.ok) {
                alert("ファイルがありません");
                return;
            }

            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = url;

            // Content-Disposition の filename を使う
            const disposition = res.headers.get("Content-Disposition");
            let filename = "received_file";

            if (disposition) {
                const match = disposition.match(/filename="(.+?)"/);
                if (match) filename = match[1];
            }

            a.download = filename;
            a.click();
            window.URL.revokeObjectURL(url);
        }
    </script>
</head>

<body>
    <div class="container">
        <h1>AiroBridge</h1>

        <!-- テキスト共有 -->
        <textarea id="textInput" rows="5" placeholder="ここにテキストを入力"></textarea>
        <button onclick="sendText()">テキスト送信</button>
        <button onclick="receiveText()">テキスト受信</button>

        <!-- ファイル共有 -->
        <input type="file" id="fileInput" style="margin-top: 20px;">
        <button onclick="sendFile()">ファイル送信</button>
        <button onclick="receiveFile()">ファイル受信</button>
    </div>
</body>
</html>
