<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>AiroBridge</title>
<style>
body {
    font-family: sans-serif;
    padding: 20px;
    background: #f5f5f5;
}
h2 {
    margin-top: 30px;
}
.frame {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    box-shadow: 0 0 5px rgba(0,0,0,0.1);
}
button {
    padding: 10px 15px;
    margin: 5px;
    border: none;
    background: #0078ff;
    color: white;
    border-radius: 5px;
}
input[type="text"] {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
}
</style>
<script>
const SERVER = "http://192.168.0.10:5000";  // ← PCのIPに変更する

// -----------------------------
// テキスト
// -----------------------------
async function sendText() {
    const text = document.getElementById("textInput").value;
    await fetch(`${SERVER}/send-text`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text})
    });
    alert("テキスト送信完了");
}

async function receiveText() {
    const r = await fetch(`${SERVER}/receive-text`);
    const data = await r.json();
    document.getElementById("textInput").value = data.text;
}

// -----------------------------
// URL
// -----------------------------
async function sendURL() {
    const url = document.getElementById("urlInput").value;
    await fetch(`${SERVER}/send-url`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({url})
    });
    alert("URL送信完了");
}

async function receiveURL() {
    const r = await fetch(`${SERVER}/receive-url`);
    const data = await r.json();
    document.getElementById("urlInput").value = data.url;
}

// -----------------------------
// スクショ受信
// -----------------------------
async function receiveScreenshot() {
    const r = await fetch(`${SERVER}/receive-screenshot`);
    if (!r.ok) {
        alert("スクショがありません");
        return;
    }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    document.getElementById("screenshotImg").src = url;
}

// -----------------------------
// ファイル送信
// -----------------------------
async function sendFile() {
    const fileInput = document.getElementById("fileInput");
    if (!fileInput.files.length) {
        alert("ファイルを選択してください");
        return;
    }
    const form = new FormData();
    form.append("file", fileInput.files[0]);

    await fetch(`${SERVER}/send-file`, {
        method: "POST",
        body: form
    });
    alert("ファイル送信完了");
}

// -----------------------------
// ファイル受信
// -----------------------------
async function receiveFile() {
    const r = await fetch(`${SERVER}/receive-file`);
    if (!r.ok) {
        alert("ファイルがありません");
        return;
    }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "received_file";
    a.click();
}
</script>
</head>
<body>

<h1>AiroBridge</h1>

<div class="frame">
    <h2>テキスト共有</h2>
    <input type="text" id="textInput" placeholder="テキストを入力">
    <button onclick="sendText()">送信</button>
    <button onclick="receiveText()">受信</button>
</div>

<div class="frame">
    <h2>URL共有</h2>
    <input type="text" id="urlInput" placeholder="URLを入力">
    <button onclick="sendURL()">送信</button>
    <button onclick="receiveURL()">受信</button>
</div>

<div class="frame">
    <h2>スクショ共有</h2>
    <button onclick="receiveScreenshot()">受信</button>
    <br><br>
    <img id="screenshotImg" style="width:100%; border:1px solid #ccc;">
</div>

<div class="frame">
    <h2>ファイル共有</h2>
    <input type="file" id="fileInput">
    <button onclick="sendFile()">送信</button>
    <button onclick="receiveFile()">受信</button>
</div>

</body>
</html>
